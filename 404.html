  var p = location.pathname.toLowerCase(), map = [["useful", "resources"], ["resource", "resources"], ["link", "resources"], ["opening", "join-us"], ["join", "join-us"], ["position", "join-us"], ["publication", "publications"], ["paper", "publications"], ["news", "news"], ["research", "research"], ["team", "team"], ["people", "team"], ["member", "team"]];

})();
</script>
