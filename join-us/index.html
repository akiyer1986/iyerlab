<style>
/* Layout: sticky wordmark bar, one content column (~72rem) per page; home pairs a crystal-lattice canvas with the lab's thesis. */
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --ink: #151a28;
  --muted: #586174;
  --line: #dde1e8;
  --sulfur: #d9a406;        /* marks, rules, lattice atoms */
  --sulfur-ink: #835f00;    /* sulfur used as text on light */
  --selenium: #b23a2e;      /* second atom colour, tags */
  --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --step-0: 1.0625rem; --step-1: 1.25rem; --step-2: 1.6rem; --step-3: 2.2rem; --step-4: clamp(2.4rem, 5.5vw, 3.8rem);
  --radius: 6px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
:root[data-theme="dark"] {
  --bg: #0d1120; --surface: #151a2b; --ink: #e7e9f0; --muted: #9ba4b7; --line: #283049;
  --sulfur: #f0c232; --sulfur-ink: #f0c232; --selenium: #e46a5c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 var(--step-0)/1.6 var(--font-body); }
a { color: var(--sulfur-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--sulfur); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
.wrap { max-width: 72rem; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.mono { font-family: var(--font-mono); font-size: 0.82em; }
.eyebrow { font: 500 0.78rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Header */
header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.8rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 700 1.15rem/1 var(--font-display); }
.brand span { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
nav.main { display: flex; gap: 0.25rem; flex-wrap: wrap; }
nav.main a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 0.35rem 0.6rem; border-radius: var(--radius); }
nav.main a:hover { color: var(--ink); }
nav.main a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--sulfur); border-radius: 0; }

main { padding-block: 2.5rem 4rem; }
section.page { display: grid; gap: 3rem; }
.page-head { display: grid; gap: 0.75rem; max-width: 62rem; }
.page-head p { color: var(--muted); font-size: var(--step-1); line-height: 1.5; }

/* Home hero */
.intro { text-align: center; display: grid; gap: 0.6rem; justify-items: center; }
.intro h1 { font-size: var(--step-4); }
.intro .subhead { color: var(--muted); font-size: var(--step-1); }
.banner { margin: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.banner img { width: 100%; aspect-ratio: 21 / 9; object-fit: cover; object-position: center 12%; display: block; }
.banner figcaption { padding: 0.55rem 0.9rem; color: var(--muted); font: 400 0.78rem/1.4 var(--font-mono); border-top: 1px solid var(--line); }
.cycle { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.8rem; max-width: 52rem; margin-inline: auto; }
.cycle-step { margin: 0; position: relative; display: grid; gap: 0.7rem; align-content: start; }
.cycle-step .art { position: relative; border-radius: 14px; border: 2px solid #1f2433; padding: 0.6rem; }
.cycle-step svg { display: block; width: 100%; height: auto; }
.cycle-step .num { position: absolute; top: -0.75rem; left: -0.75rem; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--sulfur); color: #1f2433; border: 2px solid #1f2433; display: grid; place-items: center; font: 700 0.95rem/1 var(--font-display); }
.cycle-step:not(:last-child) .art::after { content: "→"; position: absolute; top: calc(50% - 0.65rem); right: -1.55rem; font: 700 1.3rem/1 var(--font-display); color: var(--sulfur-ink); }
.cycle-return { position: relative; width: calc(52rem * 0.75 + 1.8rem * 0.75); margin: -1.6rem auto 0; height: 1.6rem; border: 2px dashed var(--sulfur-ink); border-top: 0; border-radius: 0 0 14px 14px; opacity: .8; }
.cycle-return::before { content: ""; position: absolute; left: -7px; top: -6px; border: 6px solid transparent; border-bottom: 9px solid var(--sulfur-ink); border-top: 0; }
.cycle-return span { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 50%); background: var(--bg); padding: 0 0.6rem; color: var(--sulfur-ink); font: 600 0.85rem/1 var(--font-display); white-space: nowrap; }
.cycle-step figcaption { display: grid; gap: 0.2rem; }
.cycle-step figcaption b { font: 700 0.98rem/1.2 var(--font-display); }
.cycle-step figcaption span { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
.cycle-return + .cycle-support { margin-top: 0.4rem; }
.cycle-support { display: flex; align-items: center; gap: 1rem; max-width: 40rem; margin: -0.6rem auto 0; padding: 0.6rem 1rem; border: 1px dashed var(--line); border-radius: 999px; background: var(--surface); }
.cycle-support svg { flex: none; width: 4.2rem; height: auto; }
.cycle-support p { color: var(--muted); font-size: 0.93rem; }
.cycle-support b { color: var(--ink); }
@media (max-width: 1000px) and (min-width: 761px) { .cycle { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 40rem; margin-inline: auto; } .cycle-step .art::after { display: none; } }
@media (max-width: 1000px) { .cycle-return { display: none; } }
@media (max-width: 760px) { .cycle { grid-template-columns: minmax(0, 1fr); gap: 1.4rem; } .cycle-step { grid-template-columns: minmax(0, 0.65fr) minmax(0, 1fr); align-items: center; gap: 1rem; } .cycle-step .art::after { display: none; } .cycle-support { border-radius: var(--radius); margin-top: 0; } }
@media (max-width: 480px) { .cycle-step figcaption span { font-size: 0.85rem; } }
.showcase { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.showcase figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.showcase img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #fff; }
.showcase figcaption { padding: 0.8rem 0.95rem 0.95rem; display: grid; gap: 0.25rem; border-top: 3px solid var(--sulfur); }
.showcase figcaption b { font: 700 1.05rem/1.25 var(--font-display); }
.showcase figcaption span { color: var(--muted); font-size: 0.9rem; }
@media (max-width: 960px) { .showcase { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .showcase { gap: 0.6rem; } .showcase figcaption span { display: none; } }
.welcome { display: grid; gap: 1.6rem; justify-items: center; text-align: center; }
.welcome > .welcome-art { min-width: 0; width: 100%; max-width: 64rem; text-align: left; }
.welcome-art .cycle { max-width: none; gap: 2.2rem; }
.welcome-art .cycle-return { width: calc(75% + 1.65rem); margin-top: -0.4rem; }
.welcome-art .cycle-support { max-width: 46rem; }
@media (max-width: 1000px) and (min-width: 761px) { .welcome-art .cycle { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.6rem; } .welcome-art .cycle-step:not(:last-child) .art::after { display: block; right: -1.35rem; } }
.welcome > div { display: grid; gap: 0.9rem; max-width: 64rem; }
.welcome .lede { font-size: var(--step-1); color: var(--ink); }
.welcome .lede em { font-style: normal; color: var(--sulfur-ink); }
.welcome p:not(.lede) { color: var(--muted); }
.welcome .cta { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
.ticker { display: grid; gap: 0.8rem; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); align-self: start; }
.ticker-head { display: flex; justify-content: space-between; align-items: baseline; }
.ticker-head a { font-size: 0.85rem; }
.ticker-slides { display: grid; }
.tslide { grid-area: 1 / 1; display: grid; gap: 0.45rem; align-content: start; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility .5s; }
.tslide.on { opacity: 1; visibility: visible; }
.tslide img, .tslide .tph { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--line); display: block; }
.tmedia { position: relative; display: block; }
.tmedia .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: rgba(15, 18, 28, .72); color: #fff; font-size: 1.1rem; padding-left: 0.2rem; }
.tmedia:hover .play { background: var(--sulfur-ink); }
.tslide.text-only { align-content: center; }
.tslide.text-only p { font-size: 1.05rem; line-height: 1.55; }
.tslide .muted { color: var(--muted); font-size: 0.88rem; }
.tslide .tlink { font-size: 0.88rem; font-weight: 600; }
.tslide .tph { background: var(--bg); display: grid; place-items: center; }
.tslide .tph svg { width: 62%; height: auto; }
.tslide .when { font: 500 0.78rem/1.4 var(--font-mono); color: var(--muted); }
.tslide p { font-size: 0.92rem; line-height: 1.5; color: var(--ink); }
.ticker-nav { display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
.ticker-nav button { border: 0; background: none; cursor: pointer; color: var(--muted); font: 700 1.6rem/1 var(--font-body, sans-serif); padding: 0.1rem 0.6rem; }
.ticker-nav button:hover { color: var(--ink); }
.ticker-nav .dot { width: 0.55rem; height: 0.55rem; padding: 0; border-radius: 50%; background: var(--line); }
.ticker-nav .dot.on { background: var(--sulfur-ink); }
@media (prefers-reduced-motion: reduce) { .tslide { transition: none; } }
.affil { display: grid; gap: 0.6rem; justify-items: start; padding: 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--muted); font-size: 0.92rem; }
.affil img { height: 3.6rem; width: auto; background: #fff; border-radius: 6px; padding: 0.3rem 0.5rem; }
.affil:hover { border-color: var(--sulfur); }
@media (max-width: 860px) { .welcome { grid-template-columns: minmax(0, 1fr); } .banner img { aspect-ratio: 4 / 3; } }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2.5rem; align-items: center; }
.hero h1 { font-size: var(--step-4); }
.hero h1 em { font-style: normal; color: var(--sulfur-ink); }
.hero .lede { font-size: var(--step-1); color: var(--muted); max-width: 34rem; margin-top: 1rem; }
.hero .cta { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.75rem; align-items: center; }
.btn { display: inline-block; font-weight: 600; padding: 0.6rem 1.1rem; border-radius: var(--radius); text-decoration: none; border: 1px solid var(--ink); color: var(--ink); }
.btn.solid { background: var(--ink); color: var(--bg); }
.btn:hover { text-decoration: none; opacity: 0.88; }
.lattice { position: relative; aspect-ratio: 1 / 0.9; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.hero-photo { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; overflow: hidden; }
.hero-photo img { width: 100%; display: block; }
.hero-photo figcaption { background: var(--surface); border-top: 1px solid var(--line); padding: 0.6rem 0.9rem; color: var(--muted); font: 400 0.78rem/1.4 var(--font-mono); }
.lattice canvas { width: 100%; height: 100%; display: block; }
.lattice figcaption { position: absolute; left: 0.9rem; bottom: 0.7rem; right: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font: 400 0.75rem/1.3 var(--font-mono); }
.lattice figcaption i { font-style: normal; display: inline-flex; align-items: center; gap: 0.35rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* Research areas */
.areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.area { background: var(--surface); padding: 1.5rem; display: grid; gap: 0.5rem; align-content: start; }
.area .eyebrow { color: var(--sulfur-ink); }
.area p { color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.split > div:first-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1.25rem; }
.split > div:first-child > p { max-width: 46rem; }

/* News */
.news-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.news-item { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1.25rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.news-item .when { font: 500 0.8rem/1.6 var(--font-mono); color: var(--muted); padding-top: 0.15rem; }
.news-list.compact .news-item > div:last-child { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: start; }
.news-list.compact .news-item img { width: 9rem; max-width: 9rem; aspect-ratio: 4 / 3; object-fit: cover; margin-top: 0; }
@media (max-width: 600px) { .news-list.compact .news-item img { width: 6.5rem; } }
.more-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 0.6rem; max-width: 32rem; }
.news-list.compact .more-photos { display: none; }
.news-item p + p { margin-top: 0.35rem; }
.news-list:not(.compact) .news-item > div:last-child:has(> img) { display: grid; grid-template-columns: 14rem minmax(0, 1fr); column-gap: 1.25rem; row-gap: 0; align-items: start; align-content: start; }
.news-list:not(.compact) .news-item > div:last-child > img { grid-column: 1; grid-row: 1 / span 3; margin-top: 0; width: auto; max-width: 100%; max-height: 12rem; height: auto; }
.news-list:not(.compact) .news-item > div:last-child:has(> img) > :not(img) { grid-column: 2; }
.news-list:not(.compact) .more-photos { grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); max-width: 26rem; }
@media (max-width: 600px) { .news-list:not(.compact) .news-item > div:last-child:has(> img) { grid-template-columns: 8rem minmax(0, 1fr); column-gap: 0.9rem; } }
.news-year { display: grid; gap: 1rem; }

/* Team */
.pi { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 2rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.75rem; }
.pi .bio { display: grid; gap: 0.9rem; max-width: 42rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 1rem; padding: 0.3rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--bg); }
.pi-contact { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
.icon-link { display: inline-flex; width: 2rem; height: 2rem; border-radius: 50%; }
.icon-link svg { width: 100%; height: 100%; }
.icon-link:hover { opacity: 0.8; }
.avatar { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font: 700 1.6rem/1 var(--font-display); color: var(--muted); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.group { display: grid; gap: 1.25rem; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 1.25rem; }
.person { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 0.6rem 1rem; padding: 1.1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); align-content: start; }
.person .avatar { font-size: 1.1rem; }
.person .p-head { align-self: center; min-width: 0; }
.person .p-body { grid-column: 1 / -1; min-width: 0; }
.person .p-links { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.45rem; }
.person .p-links .site-link { margin-top: 0; }
.icon-link.small { width: 1.6rem; height: 1.6rem; }
.person.shared { grid-template-columns: minmax(0, 1fr); gap: 0.9rem; }
.person.shared .shared-title { font-size: 1.1rem; }
.person.shared .mini { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.9rem; align-items: start; }
.person.shared .mini + .mini { padding-top: 0.9rem; border-top: 1px solid var(--line); }
.person.shared .mini b { font-family: var(--font-display); font-size: 1rem; }
.person.shared .mini p.desc { margin-top: 0.3rem; font-size: 0.9rem; }
.person h3 { font-size: 1.1rem; }
.person .role { font-size: 0.9rem; color: var(--muted); }
.person .since { font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); }
.person p.desc { font-size: 0.95rem; margin-top: 0.5rem; }
.person p.fun { font-size: 0.9rem; color: var(--muted); margin-top: 0.35rem; }
.person .site-link.orcid { display: block; font: 400 0.78rem/1.4 var(--font-mono); }
.person .site-link { display: inline-block; margin-top: 0.35rem; font-size: 0.85rem; }
.person .email { font: 400 0.78rem/1.4 var(--font-mono); color: var(--muted); word-break: break-all; margin-top: 0.4rem; }
.alumni { border-top: 1px solid var(--line); }
.alumni li { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 1rem; padding-block: 0.7rem; border-bottom: 1px solid var(--line); }
.alumni li span { color: var(--muted); }
ul.plain { list-style: none; margin: 0; padding: 0; }
details.more { border-top: 1px solid var(--line); padding-top: 0.2rem; }
details.more > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0; font-weight: 600; color: var(--sulfur-ink); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .chev { transition: transform 0.2s; }
details.more[open] > summary .chev { transform: rotate(180deg); }
.more-body { display: grid; gap: 1.1rem; padding-top: 0.4rem; }
@media (prefers-reduced-motion: reduce) { details.more > summary .chev { transition: none; } }

/* Publications */
.pub-tools { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
.pub-tools input { font: inherit; padding: 0.55rem 0.8rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); width: min(100%, 22rem); }
.pub-tools .count { color: var(--muted); font-size: 0.9rem; }

.pub-year > h3 { font-family: var(--font-mono); font-weight: 500; font-size: 1rem; color: var(--sulfur-ink); }
ol.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
ol.pubs li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: 0.5rem; }
ol.pubs .n { font: 400 0.8rem/1.9 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
ol.pubs .t { font-weight: 600; }
ol.pubs .j { color: var(--muted); }
ol.pubs .j em { font-style: italic; }
.me { box-shadow: inset 0 -0.35em 0 color-mix(in srgb, var(--sulfur) 30%, transparent); }

/* Openings, links, contact */
.equip { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1.25rem; }

  const keys = [...new Set(list.map(x => x[key]))].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);

  return keys.map(k => ({ key: k, items: list.filter(x => x[key] === k) }));

              : `${n.photo ? `<img src="${esc(n.photo)}" alt="${esc(altOf(n.text))}" loading="lazy">` : ""}

      </aside>`;

let tickerTimers = [];
function startTicker() { document.querySelectorAll(".ticker").forEach(startOneTicker); }
function startOneTicker(box) {
  const slides = [...box.querySelectorAll(".tslide")], dots = [...box.querySelectorAll(".dot")];
  let cur = 0, paused = false;
  const show = i => {
    cur = (i + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle("on", k === cur); s.setAttribute("aria-hidden", k === cur ? "false" : "true"); });

  });
  box.addEventListener("mouseenter", () => paused = true);
  box.addEventListener("mouseleave", () => paused = false);
  box.addEventListener("focusin", () => paused = true);
  box.addEventListener("focusout", () => paused = false);

    ${(SITE.lab.skills || []).length ? `<div class="split"><div><h2>Skills you take with you</h2><p style="color:var(--muted)">Whatever your project, you leave knowing how to make, solve and measure a new material.</p></div>
      <div class="skills">${SITE.lab.skills.map(g => `<div class="skill"><h3>${g.group}</h3><ul>${g.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div>` : ""}
    ${(SITE.lab.week || []).length ? `<div class="split"><div><h2>What it's like here</h2><p><a href="/news/">See more in the news</a></p></div>
      <div class="week">${SITE.lab.week.map(w => `<div class="week-item${w.photo ? " has-photo" : ""}">${w.photo ? `<img src="${esc(w.photo)}" alt="${esc(altOf(w.title))}" loading="lazy">` : ""}<div><h3>${w.title}</h3><p>${w.text}</p></div></div>`).join("")}</div></div>` : ""}
    <p class="note">Ready to reach out? Check the <a href="https://umanitoba.ca/science/chemistry/graduate-programs-application-info">graduate admission requirements</a> if you are applying for grad school, then email Abishek using the details below.</p>
    ${contact()}`,

  links: () => `
    <div class="page-head"><h1 style="font-size:var(--step-3)">Useful links</h1></div>
    <div class="links">${groupBy(SITE.links, "group").map((g, i) => `<div id="lg${i}"><h3 class="eyebrow">${g.key}</h3><ul class="plain">${g.items.map(l =>
      `<li><a href="${esc(l.link)}">${l.name}</a>${l.note ? `<small>${l.note}</small>` : ""}</li>`).join("")}</ul></div>`).join("")}</div>`
};

function markAuthors(s) {
  return String(s || "").replace(/(Abishek (?:K\. )?Iyer|Iyer(?:, A\. K\.)?|Vidyanshu Mishra|Manya Rishi)/g, '<span class="me">$1</span>');
}

function pubRow(p) {
  const a = markAuthors(p.authors);
  const j = `<em>${p.journal}</em> ${p.year}${p.details ? `, ${p.details}` : ""}`;
  const url = p.link;
  return `<li${p.lab_paper ? ' class="lab-paper"' : ""}><span class="n">${p.number ?? ""}</span><div>${p.lab_paper ? `<span class="badge lab">From the Iyer Lab</span>` : ""}${p.title ? `<div class="t">${url ? `<a href="${esc(url)}">${p.title}</a>` : p.title}</div>` : ""}
    <div class="j">${a}${p.title ? ". " + j : " " + (url ? `<a href="${esc(url)}">${j}</a>` : j)}</div></div></li>`;
}

function renderPubs() {
  const q = (document.getElementById("pubq")?.value || "").toLowerCase().trim();
  const all = SITE.publications;
  const list = all.filter(p => !q || Object.values(p).join(" ").replace(/<[^>]+>/g, "").toLowerCase().includes(q));
  const byYear = items => [...new Set(items.map(p => +p.year))].sort((a, b) => b - a).map(y => `<div class="pub-year"><h3>${y}</h3><ol class="pubs">${
    items.filter(p => +p.year === y).sort((a, b) => (b.number || 0) - (a.number || 0)).map(pubRow).join("")}</ol></div>`).join("");
  const um = list.filter(p => p.at_umanitoba), prior = list.filter(p => !p.at_umanitoba);
  const recent = prior.filter(p => +p.year >= CUTOFF), older = prior.filter(p => +p.year < CUTOFF);
  const section = (title, count, body) => `<section class="pub-section"><div class="pub-section-head"><h2>${title}</h2><span class="count">${count} ${count === 1 ? "paper" : "papers"}</span></div>${body}</section>`;
  let html = "";
  if (um.length) html += section("At the University of Manitoba", um.length, byYear(um));
  if (prior.length) html += section("Before the University of Manitoba", prior.length,
    byYear(recent) + (older.length ? `<details class="older"${q ? " open" : ""}><summary><span>Before ${CUTOFF}</span><span class="count">${older.length} ${older.length === 1 ? "paper" : "papers"}</span><span class="chev" aria-hidden="true">▾</span></summary>${byYear(older)}</details>` : ""));
  document.getElementById("publist").innerHTML = html || `<p style="color:var(--muted)">No papers match “${esc(q)}”.</p>`;
  document.getElementById("pubcount").textContent = q ? `${list.length} of ${all.length}` : "";
}
const CUTOFF = 2020;

/* ===================== Lattice animation ===================== */
let stopLattice = null;
function startLattice() {
  const cv = document.getElementById("lattice"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const col = k => css.getPropertyValue(k).trim();
  // Zinc-blende-like supercell: cations (M) on fcc sites, anions (Q) in tetrahedral holes.
  const atoms = [], N = 2;
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) for (let z = 0; z < N; z++) {
    for (const [a, b, c] of [[0,0,0],[.5,.5,0],[.5,0,.5],[0,.5,.5]]) atoms.push({ p: [x+a, y+b, z+c], t: "M" });
    for (const [a, b, c] of [[.25,.25,.25],[.75,.75,.25],[.75,.25,.75],[.25,.75,.75]]) atoms.push({ p: [x+a, y+b, z+c], t: "Q" });
  }
  atoms.forEach(at => at.p = at.p.map(v => v - N / 2));
  const bonds = [];
  atoms.forEach((a, i) => atoms.forEach((b, j) => {
    if (j <= i || a.t === b.t) return;
    const d = Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1], a.p[2]-b.p[2]);
    if (Math.abs(d - Math.sqrt(3) / 4) < 0.01) bonds.push([i, j]);
  }));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf, t0 = performance.now();
  function frame(now) {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
    const W = cv.width, H = cv.height, s = Math.min(W, H) * 0.33;
    const th = reduce ? 0.6 : 0.6 + (now - t0) / 9000, ph = 0.42;
    const proj = atoms.map(a => {
      let [x, y, z] = a.p;
      [x, z] = [x * Math.cos(th) - z * Math.sin(th), x * Math.sin(th) + z * Math.cos(th)];
      [y, z] = [y * Math.cos(ph) - z * Math.sin(ph), y * Math.sin(ph) + z * Math.cos(ph)];
      const k = 3.2 / (3.2 + z);
      return { x: W / 2 + x * s * k, y: H * 0.46 + y * s * k, z, k, t: a.t };
    });
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = col("--muted"); ctx.lineWidth = 1.1 * dpr;
    bonds.forEach(([i, j]) => { const a = proj[i], b = proj[j];
      ctx.globalAlpha = 0.25 + 0.35 * (1 - (a.z + b.z + 2.4) / 4.8);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); });
    ctx.globalAlpha = 1;
    proj.map((p, i) => [p, i]).sort((a, b) => b[0].z - a[0].z).forEach(([p]) => {
      ctx.fillStyle = p.t === "M" ? col("--selenium") : col("--sulfur");
      ctx.globalAlpha = 0.55 + 0.45 * (1 - (p.z + 1.2) / 2.4);
      ctx.beginPath(); ctx.arc(p.x, p.y, (p.t === "M" ? 5 : 7) * dpr * p.k, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  stopLattice = () => cancelAnimationFrame(raf);
}


/* ===================== Router ===================== */
/* Each page has its own address (/research/, /team/ ...) so search engines can list them; links between pages switch without a reload. */
const PATHS = { home: "/", research: "/research/", team: "/team/", publications: "/publications/", news: "/news/", openings: "/join-us/", links: "/resources/" };
const pageFromPath = () => {
  const old = location.hash.slice(1);
  if (PATHS[old]) { history.replaceState(null, "", PATHS[old]); return old; }   /* old #team style links */
  const path = location.pathname.replace(/\/?$/, "/").toLowerCase();
  return Object.keys(PATHS).find(k => PATHS[k] === path) || "home";
};
function route() {
  if (!SITE) return;
  const page = pageFromPath();
  if (stopLattice) { stopLattice(); stopLattice = null; }
  tickerTimers.forEach(clearInterval); tickerTimers = [];
  document.getElementById("app").innerHTML = `<section class="page">${pages[page]()}</section>`;
  document.querySelectorAll("nav.main a").forEach(a => {
    if (a.getAttribute("href") === PATHS[page]) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.title = page === "home" ? "Iyer Lab" : `${document.querySelector(`nav.main a[href="${PATHS[page]}"]`).textContent} · Iyer Lab`;
  document.querySelector('link[rel="canonical"]')?.setAttribute("href", "https://www.iyerlab.ca" + PATHS[page]);
  if (page === "home") { startLattice(); startTicker(); }
  if (page === "publications") { renderPubs(); document.getElementById("pubq").addEventListener("input", renderPubs); }
  window.scrollTo(0, 0);
  countVisit(page);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target) return;
  const href = a.getAttribute("href");
  if (!Object.values(PATHS).includes(href)) return;
  e.preventDefault();
  if (href !== location.pathname) history.pushState(null, "", href);
  route();
});
addEventListener("popstate", route);

/* Visitor counter (GoatCounter). Counts only on the live site, once a site code is set in lab.json. */
let firstVisit = true;
/* Opening the site once with ?nocount on a device stops that browser being counted; ?count turns counting back on. */
const optOut = (() => { try {
  const q = new URLSearchParams(location.search);
  if (q.has("nocount")) { localStorage.setItem("iyerlab-nocount", "1"); alert("Your visits from this browser will no longer be counted."); }
  if (q.has("count")) { localStorage.removeItem("iyerlab-nocount"); alert("Your visits from this browser will be counted again."); }
  return localStorage.getItem("iyerlab-nocount") === "1";
} catch (e) { return false; } })();
function countVisit(page) {
  if (optOut) return;
  const code = (SITE.lab.goatcounter || "").trim();
  if (!code || !/^[a-z0-9-]+$/.test(code) || /^(localhost|127\.|$)|claude|usercontent/.test(location.hostname)) return;
  const q = new URLSearchParams({ p: PATHS[page], t: document.title, r: firstVisit ? document.referrer : "", s: `${screen.width},${screen.height},${devicePixelRatio || 1}`, rnd: Math.random().toString(36).slice(2) });
  firstVisit = false;
  new Image().src = `https://${code}.goatcounter.com/count?${q}`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); };
  navigator.clipboard?.writeText(b.dataset.copy).then(done, () => {
    const r = document.createRange(); r.selectNodeContents(b.previousSibling || b.parentNode); getSelection().removeAllRanges(); getSelection().addRange(r);
  });
});
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]"); if (!j) return;
  e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

document.getElementById("app").innerHTML = `<p class="loading">Loading…</p>`;
Promise.all(FILES.map(f => fetch(`content/${f}.json`, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
  .then(data => { SITE = Object.fromEntries(FILES.map((f, i) => [f, data[i]])); route(); })
  .catch(err => { document.getElementById("app").innerHTML = `<p class="loading">The site content could not be loaded (${esc(err.message)}). Check that the content folder sits next to index.html.</p>`; });
</script>
</body></html>
