<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="xtal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a7ff"/><stop offset="1" stop-color="#7b4fd6"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#e5484d" stop-opacity=".0"/><stop offset="1" stop-color="#e5484d" stop-opacity=".18"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="#eef4ff"/>
  <text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2433">Infrared frequency doubling</text>
  <!-- laser -->
  <rect x="30" y="148" width="120" height="64" rx="10" fill="#3a4157" stroke="#1f2433" stroke-width="3"/>
  <rect x="44" y="162" width="56" height="10" rx="5" fill="#e5484d"/>
  <circle cx="122" cy="196" r="7" fill="#ffd166" stroke="#1f2433" stroke-width="2"/>
  <rect x="150" y="170" width="12" height="20" rx="2" fill="#1f2433"/>
  <text x="90" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">IR laser</text>
  <!-- input beam: long wavelength -->
  <rect x="162" y="164" width="88" height="32" fill="url(#glow)"/>
  <path d="M164 180 q11 -22 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>
  <text x="206" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#c0262b">ω</text>
  <text x="206" y="226" text-anchor="middle" font-size="13" fill="#4a5168">infrared in</text>
  <!-- crystal -->
  <polygon points="262,128 330,112 372,150 372,214 304,232 262,196" fill="url(#xtal)" stroke="#1f2433" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="262,128 304,166 372,150 M304,166 304,232" fill="none" stroke="#1f2433" stroke-width="2" opacity=".45"/>
  <path d="M276 140 l14 -4" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <text x="318" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Our crystal</text>
  <text x="318" y="288" text-anchor="middle" font-size="13" fill="#4a5168">noncentrosymmetric chalcogenide</text>
  <!-- output beam: half wavelength -->
  <path d="M374 180 q5.5 -18 11 0 t11 0 t11 0 t11 0 t11 0 t11 0 t11 0 t11 0 t11 0 t11 0" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="430" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">2ω</text>
  <text x="430" y="226" text-anchor="middle" font-size="13" fill="#4a5168">light out</text>
  <!-- detector -->
  <rect x="494" y="148" width="110" height="64" rx="10" fill="#ffffff" stroke="#1f2433" stroke-width="3"/>
  <rect x="486" y="166" width="10" height="28" rx="2" fill="#1f2433"/>
  <polyline points="506,196 524,196 532,170 540,200 548,182 556,190 590,190" fill="none" stroke="#2f9e6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="549" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Detector</text>
</svg>
